name: Android CI

on: #cada vez q se produzca esta accion
  push: # cada vez que pushee un cambio en una rama espefica quiero q ocurra algo
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs: #jobs o tareas que va a realizar
  build: #Indica en qué máquina virtual se ejecutará
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Give execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Generate version #versiones
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=auto_dev-${{ github.run_number }}-$(date +%Y%m%d)

          echo "VERSION_CODE=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME"

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build app
        run: ./gradlew assemble -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME

      - name: Build Debug APK #genera la apk
        run: ./gradlew assembleDebug -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME

      - name: Install Firebase CLI #instala firebase
        run: npm install -g firebase-tools

      - name: Configure Firebase credentials #configura las credenciales
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Distribute to Firebase # distribucion de app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes "Build $VERSION_NAME"