name: Android CI

on: #cada vez q se produzca esta accion
  push: # cada vez que pushee un cambio en una rama espefica quiero q ocurra algo
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs: #jobs o tareas que va a realizar
  build: #Indica en qué máquina virtual se ejecutará
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Give execute permission to gradlew
        run: chmod +x ./gradlew
      - name: Build app
        run: ./gradlew assemble